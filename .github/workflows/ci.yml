name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m compileall -q .

      - name: Validate example configs
        run: |
          python -c "import json; json.load(open('config.example.json', encoding='utf-8'))"
          python -c "import json; c=json.load(open('opencode.example.jsonc', encoding='utf-8')); assert c['mcp']['servers']['grid']['type'] == 'local'; print('opencode example OK')"

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @("run.ps1", "install_autostart.ps1", "uninstall_autostart.ps1", "install_opencode_mcp.ps1")
          foreach ($file in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "PASS $file"
          }

      - name: Install import-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rich requests beautifulsoup4 duckdb numpy pillow opencv-python-headless pyyaml python-docx

      - name: Import and tool registry
        run: python -c "import grid_agent; print('tools', len(grid_agent.Tools.registry)); assert len(grid_agent.Tools.registry) >= 70"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Routing evals
        run: python evals/run_evals.py
