name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Syntax check
        run: python -m compileall -q .

      - name: Validate example config
        run: python -c "import json; json.load(open('config.example.json', encoding='utf-8'))"

      - name: Install import-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rich requests beautifulsoup4 duckdb numpy pillow opencv-python-headless pyyaml

      - name: Import and tool registry
        run: python -c "import grid_agent; print('tools', len(grid_agent.Tools.registry)); assert len(grid_agent.Tools.registry) >= 70"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Routing evals
        run: python evals/run_evals.py
